name: McGPT
version: '${version}'
main: com.mcgpt.McgptPlugin
api-version: '1.21'
description: ChatGPT integration for Minecraft Paper servers
author: karlmendoo
commands:
  ai:
    description: Send a message to ChatGPT
    usage: /ai <message> or /ai reload
    permission: chatgpt.use
permissions:
  chatgpt.use:
    description: Allows using the AI chat trigger and command
    default: true
  chatgpt.admin:
    description: Allows reloading config and viewing debug info
    default: op
